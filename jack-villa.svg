<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Ultra&amp;display=swap');
      
      /* Sombra base oscura para dar volumen */
      .title-shadow {
        font-family: 'Ultra', serif;
        font-size: 88px;
        fill: #000000;
        letter-spacing: 6px;
        text-anchor: middle;
        opacity: 0.6;
      }

      /* Título principal con doble brillo fucsia intenso */
      .title {
        font-family: 'Ultra', serif;
        font-size: 88px;
        fill: #ff2a85;
        letter-spacing: 6px;
        text-anchor: middle;
        filter: drop-shadow(0 0 10px rgba(255, 42, 133, 0.9)) drop-shadow(0 0 25px rgba(255, 42, 133, 0.5));
      }
    </style>
  </defs>
  
  <!-- Capa de sombra desplazada para efecto 3D/imponente -->
  <text class="title-shadow" x="503" y="107">JAQUI VILLA</text>
  
  <!-- Título principal con neón potente -->
  <text class="title" x="500" y="103">JAQUI VILLA</text>
</svg>
