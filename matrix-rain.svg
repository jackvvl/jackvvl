<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%">
  <defs>
    <style>
      .bg {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 2px;
      }
    </style>
    <!-- Grilla cyberpunk de fondo igual a la referencia -->
    <pattern id="matrix-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#23121f" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fondo de la tarjeta con bordes redondeados y grilla -->
  <rect class="bg" width="100%" height="100%" rx="16" />
  <rect width="100%" height="100%" fill="url(#matrix-grid)" rx="16" opacity="0.7" />

  <!-- Lluvia de código densa y poblada -->
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 16px;">
      <style>
        .m-col {
          position: absolute;
          top: -150px;
          font-family: monospace;
          font-size: 14px;
          color: #ff2a85;
          line-height: 1.1;
          letter-spacing: 2px;
          writing-mode: vertical-rl;
          animation: matrixFall linear infinite;
        }
        @keyframes matrixFall {
          0% { transform: translateY(-120px); opacity: 0; }
          10% { opacity: 0.9; }
          90% { opacity: 0.9; }
          100% { transform: translateY(360px); opacity: 0; }
        }
      </style>
      <!-- Columnas distribuidas por todo el ancho para que no queden huecos -->
      <div class="m-col" style="left: 2%; animation-duration: 1.2s; animation-delay: 0s;">PUTOELQUELEE</div>
      <div class="m-col" style="left: 6%; animation-duration: 1.3s; animation-delay: 0s;">01BOCA0101</div>
      <div class="m-col" style="left: 6%; animation-duration: 1.5s; animation-delay: 0s;">01AAA0101</div>
       <div class="m-col" style="left: 8%; animation-duration: 1.7s; animation-delay: 0s;">01AAA0101</div>



      
      <div class="m-col" style="left: 4%; animation-duration: 1.2s; animation-delay: 0s;">010101C010STRUCT</div>
      <div class="m-col" style="left: 11%; animation-duration: 1.1s; animation-delay: 1.1s; color: #702042;">1010DEV01UNSL</div>
      <div class="m-col" style="left: 18%; animation-duration: 2.9s; animation-delay: 0.4s;">01MAIN0101JACK</div>

      <div class="m-col" style="left: 27%; animation-duration: 1.6s; animation-delay: 2.0s; color: #702042;">1100101010011</div>
      <div class="m-col" style="left: 35%; animation-duration: 1.5s; animation-delay: 0.7s;">010C-LANG0101</div>
      <div class="m-col" style="left: 45%; animation-duration: 1.9s; animation-delay: 1.4s; color: #702042;">0101010110101</div>
      <div class="m-col" style="left: 49%; animation-duration: 2.1s; animation-delay: 0.2s;">PRINTF("%s", me)</div>
      <div class="m-col" style="left: 50%; animation-duration: 4.3s; animation-delay: 2.3s; color: #702042;">01VILLA010UNSL</div>
      <div class="m-col" style="left: 60%; animation-duration: 2.4s; animation-delay: 0.9s;">1010010101101</div>
      <div class="m-col" style="left: 70%; animation-duration: 2.8s; animation-delay: 0.5s; color: #702042;">0101STATUS010</div>
      
      <div class="m-col" style="left: 25%; animation-duration: 1.6s; animation-delay: 2.0s; color: #702042;">1100101010011</div>
      <div class="m-col" style="left: 32%; animation-duration: 1.5s; animation-delay: 0.7s;">010C-LANG0101</div>
      <div class="m-col" style="left: 40%; animation-duration: 1.9s; animation-delay: 1.4s; color: #702042;">0101010110101</div>
      <div class="m-col" style="left: 48%; animation-duration: 2.1s; animation-delay: 0.2s;">PRINTF("%s", me)</div>
      <div class="m-col" style="left: 56%; animation-duration: 4.3s; animation-delay: 2.3s; color: #702042;">01VILLA010UNSL</div>
      <div class="m-col" style="left: 64%; animation-duration: 2.4s; animation-delay: 0.9s;">1010010101101</div>
      <div class="m-col" style="left: 72%; animation-duration: 2.8s; animation-delay: 0.5s; color: #702042;">0101STATUS010</div>
      <div class="m-col" style="left: 80%; animation-duration: 2.0s; animation-delay: 1.7s;">010101BUILDING</div>
      <div class="m-col" style="left: 88%; animation-duration: 2.7s; animation-delay: 0.8s; color: #702042;">01C_CODE_UNSL</div>
      <div class="m-col" style="left: 95%; animation-duration: 3.3s; animation-delay: 1.2s;">0101JACKVVL01</div>

      <div class="m-col" style="left: 70%; animation-duration: 1.8s; animation-delay: 0.5s; color: #702042;">0101STATUS010</div>
      <div class="m-col" style="left: 78%; animation-duration: 1.0s; animation-delay: 1.7s;">010101BUILDING</div>
      <div class="m-col" style="left: 83%; animation-duration: 1.7s; animation-delay: 0.8s; color: #702042;">01C_CODE_UNSL</div>
      <div class="m-col" style="left: 87%; animation-duration: 1.3s; animation-delay: 1.2s;">0101JACKVVL01</div>
      <div class="m-col" style="left: 90%; animation-duration: 1.0s; animation-delay: 1.7s;">010101BUILDING</div>

      
    </div>
  </foreignObject>
</svg>
